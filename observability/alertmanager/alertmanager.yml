route:
  receiver: slack
  group_by: [alertname, node]
  group_wait: 0s

inhibit_rules:
  - source_matchers: [alertname = FabricLinkDown]
    target_matchers: [alertname = BGPSessionDown]
    equal: [node, interface]

  - source_matchers: ['alertname =~ "ExporterDown|FRRCollectorFailing"']
    target_matchers: [alertname = BGPSessionMissing]
    equal: [node]

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook
        send_resolved: true
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
