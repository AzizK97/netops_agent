global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: frr
    file_sd_configs:
      - files: [/etc/prometheus/targets/frr.yml]
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.yml]
