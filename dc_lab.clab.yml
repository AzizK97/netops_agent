name: data_center

topology:
  defaults:
    kind: linux
    dns:
      servers: [1.1.1.1, 8.8.8.8]
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.7.1
  nodes:
    spine1:
      binds:
        - daemons:/etc/frr/daemons
        - configs/spine1.conf:/etc/frr/frr.conf:ro
        - bin/frr_exporter:/usr/local/bin/frr_exporter:ro
        - bin/node_exporter:/usr/local/bin/node_exporter:ro
        - logs/spine1:/var/log/frr
      exec:
        - apk add tcpdump
        - sh -c "nohup frr_exporter --no-collector.ospf --no-collector.bfd >/dev/null 2>&1 &"
        - sh -c "nohup node_exporter --collector.disable-defaults --collector.netdev --collector.netclass >/dev/null 2>&1 &"
    spine2:
      binds:
        - daemons:/etc/frr/daemons
        - configs/spine2.conf:/etc/frr/frr.conf:ro
        - bin/frr_exporter:/usr/local/bin/frr_exporter:ro
        - bin/node_exporter:/usr/local/bin/node_exporter:ro
        - logs/spine2:/var/log/frr
      exec:
        - apk add tcpdump
        - sh -c "nohup frr_exporter --no-collector.ospf --no-collector.bfd >/dev/null 2>&1 &"
        - sh -c "nohup node_exporter --collector.disable-defaults --collector.netdev --collector.netclass >/dev/null 2>&1 &"
    leaf1:
      binds:
        - daemons:/etc/frr/daemons
        - configs/leaf1.conf:/etc/frr/frr.conf:ro
        - bin/frr_exporter:/usr/local/bin/frr_exporter:ro
        - bin/node_exporter:/usr/local/bin/node_exporter:ro
        - logs/leaf1:/var/log/frr
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        - apk add tcpdump
        - sh -c "nohup frr_exporter --no-collector.ospf --no-collector.bfd >/dev/null 2>&1 &"
        - sh -c "nohup node_exporter --collector.disable-defaults --collector.netdev --collector.netclass >/dev/null 2>&1 &"
    leaf2:
      binds:
        - daemons:/etc/frr/daemons
        - configs/leaf2.conf:/etc/frr/frr.conf:ro
        - bin/frr_exporter:/usr/local/bin/frr_exporter:ro
        - bin/node_exporter:/usr/local/bin/node_exporter:ro
        - logs/leaf2:/var/log/frr
      exec:
        - apk add tcpdump
        - sh -c "nohup frr_exporter --no-collector.ospf --no-collector.bfd >/dev/null 2>&1 &"
        - sh -c "nohup node_exporter --collector.disable-defaults --collector.netdev --collector.netclass >/dev/null 2>&1 &"
    leaf3:
      binds:
        - daemons:/etc/frr/daemons
        - configs/leaf3.conf:/etc/frr/frr.conf:ro
        - bin/frr_exporter:/usr/local/bin/frr_exporter:ro
        - bin/node_exporter:/usr/local/bin/node_exporter:ro
        - logs/leaf3:/var/log/frr
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        - apk add tcpdump
        - sh -c "nohup frr_exporter --no-collector.ospf --no-collector.bfd >/dev/null 2>&1 &"
        - sh -c "nohup node_exporter --collector.disable-defaults --collector.netdev --collector.netclass >/dev/null 2>&1 &"
    leaf4:
      binds:
        - daemons:/etc/frr/daemons
        - configs/leaf4.conf:/etc/frr/frr.conf:ro
        - bin/frr_exporter:/usr/local/bin/frr_exporter:ro
        - bin/node_exporter:/usr/local/bin/node_exporter:ro
        - logs/leaf4:/var/log/frr
      exec:
        - apk add tcpdump
        - sh -c "nohup frr_exporter --no-collector.ospf --no-collector.bfd >/dev/null 2>&1 &"
        - sh -c "nohup node_exporter --collector.disable-defaults --collector.netdev --collector.netclass >/dev/null 2>&1 &"
    host1:
      image: alpine:latest
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1
    host2:
      image: alpine:latest
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route replace default via 192.168.2.1
    host3:
      image: alpine:latest
      exec:
        - ip addr add 192.168.3.10/24 dev eth1
        - ip route replace default via 192.168.3.1
    host4:
      image: alpine:latest
      exec:
        - ip addr add 192.168.3.11/24 dev eth1
        - ip route replace default via 192.168.3.1
    host5:
      image: alpine:latest
      exec:
        - ip addr add 192.168.1.11/24 dev eth1
        - ip route replace default via 192.168.1.1
    host6:
      image: alpine:latest
      exec:
        - ip addr add 192.168.4.10/24 dev eth1
        - ip route replace default via 192.168.4.1

  links:
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf3:eth1", "spine1:eth3"]
    - endpoints: ["leaf3:eth2", "spine2:eth3"]
    - endpoints: ["leaf4:eth1", "spine1:eth4"]
    - endpoints: ["leaf4:eth2", "spine2:eth4"]
    - endpoints: ["host1:eth1", "leaf1:eth3"]
    - endpoints: ["host2:eth1", "leaf2:eth3"]
    - endpoints: ["host3:eth1", "leaf3:eth3"]
    - endpoints: ["host4:eth1", "leaf3:eth4"]
    - endpoints: ["host5:eth1", "leaf1:eth4"]
    - endpoints: ["host6:eth1", "leaf4:eth3"]




